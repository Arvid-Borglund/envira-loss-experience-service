services:
  lossexp:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - "./data:/app/data:ro"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
