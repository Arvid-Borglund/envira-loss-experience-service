services:
  lossexp:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - type: bind
        source: ${DATA_DIR:-./data}  # engine-side path; see README for a WSL engine
        target: /app/data
        read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
